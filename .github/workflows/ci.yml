name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: pip install -r requirements-analysis.txt
      - name: Compile source
        run: python -m compileall -q scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Audit public release boundary
        run: python scripts/audit_public_release.py
